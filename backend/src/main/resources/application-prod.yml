spring:
  datasource:
    # Docker 环境中使用容器名连接；非 Docker 环境改为实际 IP
    url: jdbc:postgresql://${DB_HOST:kingbase}:${DB_PORT:5432}/${DB_NAME:college_service}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 数据库重启/网络抖动后自动剔除失效连接, 避免后端握死连接导致接口全 500
      keepalive-time: 30000           # 30s 对空闲连接探活, 提前发现并替换死连接 (须 < max-lifetime)
      max-lifetime: 600000            # 连接最长存活 10min, 到点主动回收重建
      connection-timeout: 10000       # 取连接最长等待 10s
      validation-timeout: 5000        # 连接有效性校验超时 5s
      connection-test-query: SELECT 1 # 取连接前校验有效性 (DB 重启后旧连接会被判失效并丢弃)

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

# 生产环境关闭 SQL 日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 生产环境关闭 Swagger
knife4j:
  enable: false
